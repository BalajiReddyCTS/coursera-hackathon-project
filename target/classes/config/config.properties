# ============================================================
# config.properties - Central configuration for the framework
# Change values here; they auto-apply everywhere.
# ============================================================

# Browser to use: chrome | firefox | edge
browser=chrome

# Base URL
baseUrl=https://www.coursera.org

# Implicit wait (seconds) — how long Selenium waits before NoSuchElementException
implicitWait=10

# Explicit wait (seconds) — used in WaitUtil for specific conditions
explicitWait=15

# Page load timeout
pageLoadTimeout=30

# Number of courses to extract and save to Excel
coursesToExtract=10

# Excel output file path
excelOutputPath=src/test/resources/testdata/CourseData.xlsx
